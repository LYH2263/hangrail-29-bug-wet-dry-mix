services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hangrail
      POSTGRES_PASSWORD: hangrail
      POSTGRES_DB: hangrail
    ports: ["5445:5432"]
    volumes: [hangrail_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangrail -d hangrail"]
      interval: 3s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://hangrail:hangrail@db:5432/hangrail
      SEED_ON_EMPTY: "true"
    ports: ["9400:9400"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["4400:80"]
    depends_on: [api]
volumes:
  hangrail_pg:
